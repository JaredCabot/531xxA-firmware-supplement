name: Bug report
description: Something does not work as the README describes
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The more of this you can fill in, the faster the problem can be found.

        This form is for the two tools. For a mistake in the Firmware and Service Supplement, use **Error in the documentation** instead.
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - "531xx_gpib_tool.py (live, over GPIB)"
        - "531xx_eeprom_tool.py (offline .BIN editor)"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Counter model
      options:
        - "53131A"
        - "53132A"
        - "53181A"
    validations:
      required: true
  - type: input
    id: instrument
    attributes:
      label: Instrument ID and options
      description: The identification line the tool printed, and the options fitted (Channel 3, oven oscillator).
      placeholder: "HEWLETT-PACKARD,53132A,0,4613 - option 030 (Ch3), 010"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 23H2 / Ubuntu 24.04 / macOS 14.5"
    validations:
      required: true
  - type: input
    id: transport
    attributes:
      label: Python, transport and adapter
      description: Python version, and for the GPIB tool whether it used PyVISA (and which VISA and adapter) or a serial adapter.
      placeholder: "Python 3.12.4, PyVISA with NI-VISA, NI GPIB-USB-HS"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What were you doing?
      options:
        - "Identifying the counter"
        - "Backing up or restoring calibration data"
        - "Setting the Channel 3 option"
        - "Calibration security code"
        - "Raw SCPI"
        - "Decoding or editing a .BIN dump"
        - "Factory-blanking an image"
        - "Something else"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include any message the program or the instrument showed, word for word.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the problem, and whether it happens every time.
      placeholder: |
        1. python 531xx_gpib_tool.py --visa
        2. ...
    validations:
      required: false
  - type: textarea
    id: output
    attributes:
      label: Console output
      description: Paste everything the tool printed, including the command line you used.
      render: text
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Please do not attach calibration data, EEPROM or NVRAM images unless asked - they are specific to one instrument.
    validations:
      required: false
